<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivaStage | 运行诊断</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        body.diag-page {
            position: relative;
            min-height: 100dvh;
            overflow-x: hidden;
            padding: clamp(20px, 4vw, 56px);
            background:
                linear-gradient(120deg, rgba(11, 7, 13, 0.96), rgba(11, 7, 13, 0.74)),
                url('/img/sekai-stage.png') center / cover fixed;
        }

        body.diag-page::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 76% 10%, rgba(241, 154, 132, 0.12), transparent 30%);
        }

        .diag-shell {
            position: relative;
            z-index: 1;
            width: min(1120px, 100%);
            margin: 0 auto;
        }

        .diag-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: clamp(34px, 7vw, 82px);
        }

        .diag-brand,
        .diag-back {
            color: var(--ds-text-soft);
            text-decoration: none;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .diag-brand { color: var(--ds-text); font-weight: 700; }
        .diag-back { color: var(--ds-accent-strong); }
        .diag-back:hover { color: var(--ds-text); }

        .diag-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 28px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--ds-line);
        }

        .diag-kicker {
            margin: 0 0 14px;
            color: var(--ds-accent-strong);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .diag-header h1 {
            margin: 0;
            color: var(--ds-text);
            font-size: clamp(2.4rem, 7vw, 5rem);
            font-weight: 650;
            letter-spacing: -0.06em;
            line-height: 0.96;
        }

        .diag-header p:last-child {
            max-width: 52ch;
            margin: 18px 0 0;
            color: var(--ds-text-soft);
            line-height: 1.65;
        }

        .diag-badge {
            flex: 0 0 auto;
            padding: 9px 14px;
            border: 1px solid var(--ds-line);
            border-radius: var(--ds-pill);
            color: var(--ds-text-muted);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .diag-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 0.86fr);
            gap: 18px;
            margin-top: 18px;
        }

        .diag-panel {
            min-width: 0;
            border: 1px solid var(--ds-line);
            border-radius: var(--ds-radius);
            background: var(--ds-surface);
            box-shadow: var(--ds-shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .diag-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--ds-line);
        }

        .diag-panel-head h2,
        .diag-panel-head span {
            margin: 0;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .diag-panel-head h2 { color: var(--ds-text); }
        .diag-panel-head span { color: var(--ds-text-muted); }

        #log {
            height: min(52dvh, 520px);
            overflow-y: auto;
            margin: 0;
            padding: 18px;
            color: var(--ds-text-soft);
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.78rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .diag-canvas-wrap { padding: 18px; }

        .diag-canvas-note {
            margin: 0 0 14px;
            color: var(--ds-text-muted);
            font-size: 0.78rem;
            line-height: 1.5;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid var(--ds-line-strong);
            border-radius: 10px;
            background: rgba(11, 7, 13, 0.78);
        }

        .ok { color: #b8e3bf; }
        .fail { color: #f4b1b7; }
        .info { color: var(--ds-accent-strong); }

        @media (max-width: 820px) {
            body.diag-page { padding: 20px 14px 32px; }
            .diag-header { align-items: start; flex-direction: column; }
            .diag-grid { grid-template-columns: 1fr; }
            #log { height: 34dvh; }
        }

        @media (prefers-reduced-motion: reduce) {
            .diag-badge { transition: none; }
        }
    </style>
</head>
<body class="diag-page">
<main class="diag-shell">
    <nav class="diag-nav" aria-label="诊断导航">
        <a class="diag-brand" href="/live2d">DivaStage</a>
        <a class="diag-back" href="/live2d">返回舞台</a>
    </nav>

    <header class="diag-header">
        <div>
            <p class="diag-kicker">Runtime / Live2D</p>
            <h1>运行诊断</h1>
            <p>检查浏览器端 PixiJS、Cubism Core 与角色模型是否可以正常进入舞台。</p>
        </div>
        <span id="diag-badge" class="diag-badge">等待检查</span>
    </header>

    <section class="diag-grid" aria-label="诊断结果">
        <div class="diag-panel">
            <div class="diag-panel-head">
                <h2>加载日志</h2>
                <span>Live2D / 01</span>
            </div>
            <div id="log" aria-live="polite"></div>
        </div>

        <figure class="diag-panel" style="margin: 0;">
            <div class="diag-panel-head">
                <h2>模型预览</h2>
                <span>800 x 600</span>
            </div>
            <div class="diag-canvas-wrap">
                <p class="diag-canvas-note">如果模型加载成功，预览区域会显示 Haru。</p>
                <canvas id="c" width="800" height="600"></canvas>
            </div>
        </figure>
    </section>
</main>

<script src="/js/pixi.min.js"></script>
<script src="/js/live2dcubismcore.min.js"></script>
<script src="/js/pixi-live2d-display.min.js"></script>

<script>
var logEl = document.getElementById('log');
var badgeEl = document.getElementById('diag-badge');

function setBadge(text, tone) {
    badgeEl.textContent = text;
    badgeEl.dataset.tone = tone || 'pending';
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && badgeEl.animate) {
        badgeEl.animate([
            { opacity: 0.35, transform: 'translateY(4px)' },
            { opacity: 1, transform: 'translateY(0)' }
        ], { duration: 280, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
    }
}

function L(msg, cls) {
    var s = cls ? '<span class="' + cls + '">' + msg + '</span>' : msg;
    logEl.innerHTML += s + '\n';
    logEl.scrollTop = logEl.scrollHeight;
}

L('DivaStage runtime check');
L('PixiJS: ' + (typeof PIXI !== 'undefined' ? 'OK v' + PIXI.VERSION : 'MISSING'),
    typeof PIXI !== 'undefined' ? 'ok' : 'fail');
L('Live2DCubismCore: ' + (typeof Live2DCubismCore !== 'undefined' ? 'OK' : 'MISSING'),
    typeof Live2DCubismCore !== 'undefined' ? 'ok' : 'fail');
L('PIXI.live2d: ' + (typeof PIXI !== 'undefined' && PIXI.live2d ? 'OK' : 'MISSING'),
    typeof PIXI !== 'undefined' && PIXI.live2d ? 'ok' : 'fail');

if (typeof Live2DCubismCore !== 'undefined') {
    L('Core version: ' + Live2DCubismCore.Version.csmGetVersion(), 'info');
    L('Latest moc version: ' + Live2DCubismCore.Version.csmGetLatestMocVersion(), 'info');
}

var app;
try {
    app = new PIXI.Application({
        view: document.getElementById('c'),
        width: 800,
        height: 600,
        backgroundAlpha: 0,
        backgroundColor: 0x0b070d,
        antialias: true
    });
    L('PixiJS 应用: OK', 'ok');
} catch (e) {
    L('PixiJS 应用: ' + e.message, 'fail');
    setBadge('初始化失败', 'fail');
}

async function load() {
    L('开始加载模型', 'info');
    setBadge('正在检查', 'pending');

    if (typeof PIXI !== 'undefined' && PIXI.live2d && PIXI.live2d.startUpCubism4) {
        try {
            L('启动 Cubism4...', 'info');
            await PIXI.live2d.startUpCubism4(Live2DCubismCore);
            L('Cubism4: OK', 'ok');
        } catch (e) {
            L('Cubism4: ' + e.message, 'fail');
        }
    }

    var url = '/live2d-models/haru_ja/haru_ja.model3.json';
    L('加载: ' + url, 'info');

    try {
        var resp = await fetch(url);
        L('模型文件: ' + resp.status, resp.ok ? 'ok' : 'fail');
        if (!resp.ok) {
            setBadge('模型不可用', 'fail');
            return;
        }

        var model = await PIXI.live2d.Live2DModel.from(url);
        L('模型实例: OK', 'ok');
        model.scale.set(0.15);
        model.anchor.set(0.5, 0.5);
        model.x = 400;
        model.y = 300;
        app.stage.addChild(model);
        L('诊断完成，预览已就绪。', 'ok');
        setBadge('检查通过', 'ok');
    } catch (e) {
        L('错误: ' + e.message, 'fail');
        L('Stack: ' + (e.stack || 'none'), 'fail');
        setBadge('检查失败', 'fail');
    }
}

setTimeout(load, 500);
</script>
</body>
</html>

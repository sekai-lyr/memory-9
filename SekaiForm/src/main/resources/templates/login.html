<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivaStage - Terminal Access</title>
    <link rel="stylesheet" href="/css/app.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* === Grid Background === */
        .grid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .grid-bg canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* === Login Wrapper === */
        .login-wrapper { width: 100%; max-width: 420px; padding: 24px; animation: slideUp 0.8s ease-out; z-index: 1; position: relative; }
        
        .login-card { padding: 40px 32px; position: relative; overflow: hidden; border-radius: 16px; }
        .login-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 25% 20%, rgba(0,229,192,0.04) 0%, transparent 45%),
                        radial-gradient(circle at 75% 70%, rgba(124,58,237,0.04) 0%, transparent 45%);
            pointer-events: none;
        }
        
        /* === Logo / Title === */
        .logo-area { text-align: center; margin-bottom: 28px; position: relative; }
        .logo-hex {
            display: inline-block; width: 48px; height: 48px; position: relative; margin-bottom: 14px;
            border: 2px solid var(--accent3); border-radius: 4px;
            box-shadow: 0 0 15px rgba(0,229,192,0.3), inset 0 0 10px rgba(0,229,192,0.08);
            animation: pulseSlow 3s ease-in-out infinite;
            transform: rotate(45deg);
        }
        .logo-hex-inner {
            position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 1px solid rgba(0,229,192,0.4); border-radius: 3px;
        }
        .login-card h1 {
            font-size: 2.2em; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #00e5c0, #7c3aed);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: drop-shadow(0 0 15px rgba(0,229,192,0.25));
        }
        .login-card .sub {
            color: var(--text-dim); font-size: 0.75em; letter-spacing: 4px;
            text-transform: uppercase; font-family: 'SF Mono', 'Cascadia Code', monospace;
            margin-top: 4px;
        }
        
        /* === Scan Line === */
        .scan-line {
            position: absolute; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,229,192,0.35), transparent);
            animation: scanSweep 3s ease-in-out infinite;
            pointer-events: none; z-index: 2;
        }
        
        /* === Error === */
        .error-msg {
            background: rgba(255,90,90,0.08); border: 1px solid rgba(255,90,90,0.25);
            color: #ff6b6b; padding: 10px 14px; border-radius: 8px;
            margin-bottom: 20px; font-size: 0.8em; font-weight: 600; text-align: center;
        }
        
        /* === Form === */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 5px; color: var(--text-dim);
            font-size: 0.7em; font-weight: 600; text-transform: uppercase;
            letter-spacing: 2.5px; font-family: 'SF Mono', 'Cascadia Code', monospace;
        }
        .form-group .input-wrap { position: relative; }
        .form-group input {
            background: rgba(255,255,255,0.03); border: 1.5px solid rgba(0,229,192,0.1);
            border-radius: 10px; padding: 13px 14px 13px 38px; font-size: 0.95em;
            transition: all 0.3s; width: 100%; color: var(--text);
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            letter-spacing: 0.5px;
        }
        .form-group input:focus {
            border-color: var(--accent3);
            box-shadow: 0 0 20px rgba(0,229,192,0.08), inset 0 0 12px rgba(0,229,192,0.03);
            background: rgba(0,229,192,0.03); outline: none;
        }
        .form-group .input-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: var(--text-dim); font-size: 0.85em; pointer-events: none;
            transition: color 0.3s;
        }
        .form-group input:focus ~ .input-icon,
        .form-group input:focus + .input-icon { color: var(--accent3); }

        /* === Login Button === */
        .login-btn {
            width: 100%; padding: 13px; border: 1px solid rgba(0,229,192,0.3);
            border-radius: 10px; background: linear-gradient(135deg, rgba(0,229,192,0.15), rgba(124,58,237,0.15));
            color: var(--accent3); font-size: 0.95em; font-weight: 700; cursor: pointer;
            transition: all 0.3s; margin-top: 6px; letter-spacing: 2px;
            text-transform: uppercase; font-family: 'SF Mono', 'Cascadia Code', monospace;
            box-shadow: 0 2px 15px rgba(0,229,192,0.08);
            position: relative; overflow: hidden;
        }
        .login-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,229,192,0.1), transparent);
            transition: left 0.5s;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, rgba(0,229,192,0.25), rgba(124,58,237,0.25));
            border-color: rgba(0,229,192,0.5);
            box-shadow: 0 4px 25px rgba(0,229,192,0.2);
            transform: translateY(-1px);
        }
        .login-btn:hover::before { left: 100%; }
        
        /* === Hint === */
        .hint {
            text-align: center; margin-top: 18px; color: var(--text-dim);
            font-size: 0.7em; font-family: 'SF Mono', 'Cascadia Code', monospace;
            opacity: 0.5;
        }
        .hint code {
            background: rgba(0,229,192,0.06); padding: 2px 8px; border-radius: 4px;
            color: var(--accent3); border: 1px solid rgba(0,229,192,0.12);
            font-family: 'SF Mono', 'Cascadia Code', monospace;
        }

        /* === Footer Status === */
        .login-footer {
            text-align: center; margin-top: 24px; font-size: 0.65em;
            color: var(--text-dim); font-family: 'SF Mono', 'Cascadia Code', monospace;
            opacity: 0.4;
        }
        .login-footer .blink { animation: pulseSlow 1.5s ease-in-out infinite; color: var(--accent3); }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="login-wrapper">
    <div class="login-card glass-card neon-box holo-scan corner-clip">
        <div class="scan-line"></div>
        <div class="logo-area">
            <div class="logo-hex"><div class="logo-hex-inner"></div></div>
            <h1>DivaStage</h1>
            <p class="sub">Terminal Access v2.0</p>
        </div>

        <div class="error-msg" th:if="${error}" th:text="${error}">Error message</div>

        <form id="loginForm" method="post" action="/login" autocomplete="off">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <input type="text" name="userName" id="userName" placeholder="Enter username" th:value="${userName}" value="sekai" autofocus>
                    <span class="input-icon">&gt;</span>
                </div>
            </div>
            <div class="form-group">
                <label>Passkey</label>
                <div class="input-wrap">
                    <input type="password" name="password" id="password" placeholder="Enter passkey" value="123456520baba">
                    <span class="input-icon">&gt;</span>
                </div>
            </div>
            <button type="submit" class="login-btn">Initialize Connection</button>
        </form>

        <p class="hint">Default credentials: <code>sekai</code> / <code>123456520baba</code></p>
    </div>
    <p class="login-footer">
        <span class="blink">&#9679;</span> NODE :: SEKAI-01 &nbsp; STATUS :: ONLINE
    </p>
</div>

<script>
(function() {
    var canvas = document.getElementById('bgCanvas');
    var ctx = canvas.getContext('2d');
    var particles = [];
    var cols, rows;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        cols = Math.ceil(canvas.width / 60);
        rows = Math.ceil(canvas.height / 60);
    }

    for (var i = 0; i < 60; i++) {
        particles.push({
            x: Math.random() * 2000,
            y: Math.random() * 2000,
            size: Math.random() * 1.5 + 0.5,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: (Math.random() - 0.5) * 0.3,
            opacity: Math.random() * 0.5 + 0.1,
            pulse: Math.random() * Math.PI * 2
        });
    }

    function drawGrid(t) {
        var step = 60;
        ctx.strokeStyle = 'rgba(0,229,192,0.025)';
        ctx.lineWidth = 0.5;
        for (var x = step; x < canvas.width; x += step) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (var y = step; y < canvas.height; y += step) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        // Main axes glow
        var cx = canvas.width / 2, cy = canvas.height / 2;
        ctx.strokeStyle = 'rgba(0,229,192,0.06)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
    }

    function drawParticles(t) {
        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.x += p.speedX;
            p.y += p.speedY;
            if (p.x < 0) p.x += canvas.width;
            if (p.y < 0) p.y += canvas.height;
            if (p.x > canvas.width) p.x -= canvas.width;
            if (p.y > canvas.height) p.y -= canvas.height;
            var flicker = Math.sin(t * 0.002 + p.pulse) * 0.3 + 0.7;
            ctx.fillStyle = 'rgba(0,229,192,' + (p.opacity * flicker) + ')';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function animate(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid(t);
        drawParticles(t);
        requestAnimationFrame(animate);
    }

    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(animate);

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        var u = document.getElementById('userName').value.trim();
        var p = document.getElementById('password').value.trim();
        if (!u || !p) { e.preventDefault(); alert('Please enter username and password'); }
    });
})();
</script>
</body>
</html>
